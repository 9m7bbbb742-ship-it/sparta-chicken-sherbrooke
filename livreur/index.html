<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Espace livreur | Sparta Chicken</title><style>
:root{color-scheme:light;--wine:#681b2b;--gold:#e0ad36;--cream:#fff8e9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8f0df,#ead5a7);color:#2b211b;font:15px system-ui}header{background:linear-gradient(110deg,#271e1e,#681b2b);color:#fff4df;padding:22px max(18px,calc((100vw - 950px)/2));border-bottom:4px solid var(--gold)}header h1{margin:3px 0;font-size:25px}header small{letter-spacing:.14em;color:#f0c765}main{max-width:950px;margin:25px auto;padding:0 16px}.panel,.card{background:var(--cream);border:1px solid #ddc58e;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #51320d0b}.login{max-width:420px;margin:9vh auto}.login h2{margin-top:0}label{display:grid;gap:6px;margin:12px 0;color:#5d4b3a;font-size:13px}input{padding:12px;border:1px solid #d9c18a;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:11px 15px;background:linear-gradient(110deg,#f0ce73,#dba536);font-weight:800;color:#291d12;cursor:pointer;margin:4px}button.alt{background:#681b2b;color:#fff4df}.muted{color:#766b5e;font-size:13px}.error{color:#a72b25}.item{border-top:1px solid #eadbb9;padding:14px 0}.item:first-child{border:0}.pill{display:inline-block;background:#f2e3bd;border-radius:30px;padding:4px 9px;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
</style><body><header><small>BY SPARTA CHICKEN · SHERBROOKE</small><h1>Espace livreur</h1></header><main><section id="login" class="panel login"><h2>Connexion livreur</h2><form id="loginForm"><label>Nom d’utilisateur<input name="username" autocomplete="username" required></label><label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label><button>Se connecter</button><p id="error" class="error"></p></form></section><section id="app" hidden><div class="row"><h2>Mes livraisons</h2><button class="alt" id="refresh">Actualiser</button><button id="logout">Déconnexion</button></div><p class="muted">Tu vois uniquement les livraisons assignées à ton compte.</p><div id="deliveries"></div></section></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o={}){const r=await fetch('/api/staff/'+p,{credentials:'same-origin',headers:{'content-type':'application/json'},...o}),d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');return d}
function receipt(x){let items=[];try{items=JSON.parse(x.items_json||'[]')}catch{}const rows=Array.isArray(items)?items.map(i=>'<tr><td>'+esc(i.name||i.title||'Article')+'</td><td>'+esc(i.quantity||1)+'</td><td>'+((Number(i.price_cents||0)*Number(i.quantity||1))/100).toLocaleString('fr-CA',{style:'currency',currency:'CAD'})+'</td></tr>').join(''):'';
const total=Number(x.total_cents||0)/100;const w=window.open('','_blank','width=420,height=620');if(!w)return;w.document.write('<!doctype html><html lang="fr"><meta charset="utf-8"><title>Reçu Sparta Chicken</title><body style="font:14px system-ui;max-width:360px;margin:24px auto"><h2>BY SPARTA CHICKEN</h2><p>Reçu de commande #'+x.order_id+'</p><p>'+esc(x.scheduled_at||x.delivered_at||x.created_at)+'</p><table style="width:100%;text-align:left">'+rows+'</table><hr><b>Total : '+total.toLocaleString('fr-CA',{style:'currency',currency:'CAD'})+'</b><p>Merci de votre commande !</p></body></html>');w.document.close();w.print()}
async function load(){const d=await api('deliveries');$('#deliveries').innerHTML=d.deliveries.length?d.deliveries.map(x=>'<article class="card"><div class="row"><b>Livraison #'+x.id+'</b><span class="pill">'+esc(x.status)+'</span></div><h3>'+esc(x.customer_name)+'</h3><p>'+esc(x.address)+'</p><p>'+(x.customer_phone?'<a href="tel:'+encodeURIComponent(x.customer_phone)+'">Appeler le client : '+esc(x.customer_phone)+'</a>':'Téléphone non fourni')+'</p><p class="muted">'+(x.distance_km||'—')+' km · '+esc(x.scheduled_at?'Prévue : '+x.scheduled_at:x.created_at)+(x.eta_minutes?' · ETA '+x.eta_minutes+' min':'')+'</p><p class="muted">Paiement : '+esc(x.order_payment_status||x.payment_status||'non renseigné')+' · '+esc(x.payment_method||'à configurer')+'</p><div class="row"><a href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(x.address)+'" target="_blank" rel="noopener">Ouvrir la navigation ↗</a><button onclick="receipt('+JSON.stringify(x).replace(/</g,'\\u003c')+')">Imprimer reçu</button></div><div class="row">'+(x.status==='assigned'?'<button data-id="'+x.id+'" data-status="picked_up">Colis récupéré</button>':'')+'<button class="alt" data-id="'+x.id+'" data-status="delivered">Livraison terminée</button></div></article>').join(''):'<p class="panel">Aucune livraison assignée pour le moment.</p>'}
async function start(){try{const s=await api('session');if(s.role!=='driver')throw Error('Ce compte n’est pas un compte livreur.');$('#login').hidden=true;$('#app').hidden=false;await load()}catch{}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const s=await api('login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(s.role!=='driver')throw Error('Compte livreur requis.');await start()}catch(x){$('#error').textContent=x.message}};
$('#refresh').onclick=()=>load().catch(e=>alert(e.message));$('#logout').onclick=async()=>{await api('logout',{method:'POST'});location.reload()};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-id]');if(!b)return;try{await api('deliveries/'+b.dataset.id,{method:'PATCH',body:JSON.stringify({status:b.dataset.status})});await load()}catch(x){alert(x.message)}});
start();
</script></body></html>
