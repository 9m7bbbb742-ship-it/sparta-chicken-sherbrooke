<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Espace équipe | Sparta Chicken</title><style>
:root{color-scheme:light;--wine:#681b2b;--gold:#e0ad36;--cream:#fff8e9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8f0df,#ead5a7);color:#2b211b;font:15px system-ui}header{background:linear-gradient(110deg,#271e1e,#681b2b);color:#fff4df;padding:22px max(18px,calc((100vw - 950px)/2));border-bottom:4px solid var(--gold)}header h1{margin:3px 0;font-size:25px}header small{letter-spacing:.14em;color:#f0c765}main{max-width:950px;margin:25px auto;padding:0 16px}.panel,.card{background:var(--cream);border:1px solid #ddc58e;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #51320d0b}.login{max-width:420px;margin:9vh auto}.login h2{margin-top:0}label{display:grid;gap:6px;margin:12px 0;color:#5d4b3a;font-size:13px}input{padding:12px;border:1px solid #d9c18a;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:11px 15px;background:linear-gradient(110deg,#f0ce73,#dba536);font-weight:800;color:#291d12;cursor:pointer;margin:4px}button.alt{background:#681b2b;color:#fff4df}.muted{color:#766b5e;font-size:13px}.error{color:#a72b25}.item{border-top:1px solid #eadbb9;padding:14px 0}.item:first-child{border:0}.pill{display:inline-block;background:#f2e3bd;border-radius:30px;padding:4px 9px;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}.lines{margin:8px 0;padding-left:18px}.lines li{margin:4px 0}.lines small{display:block;color:#a72b25;font-weight:700}.store{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:#2e9d57}.dot.off{background:#c0392b}button.warn{background:#c0392b;color:#fff}
</style><body><header><small>BY SPARTA CHICKEN · SHERBROOKE</small><h1>Espace équipe restaurant</h1></header><main><section id="login" class="panel login"><h2>Connexion employé</h2><form id="loginForm"><label>Nom d’utilisateur<input name="username" autocomplete="username" required></label><label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label><button>Se connecter</button><p id="error" class="error"></p></form></section><section id="app" hidden><div class="row"><h2>Commandes à traiter</h2><button class="alt" id="refresh">Actualiser</button><button id="logout">Déconnexion</button></div><p class="muted">Mise à jour des statuts de préparation.</p><div id="store" class="panel store"></div><div id="orders"></div><h2>Réservations</h2><div id="reservations"></div></section></main><script>
const $=s=>document.querySelector(s),money=n=>(Number(n||0)/100).toLocaleString('fr-CA',{style:'currency',currency:'CAD'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o={}){const r=await fetch('/api/staff/'+p,{credentials:'same-origin',headers:{'content-type':'application/json'},...o}),d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');return d}
const FR={pending:'Nouvelle',confirmed:'Confirmée',preparing:'En préparation',ready:'Prête',completed:'Terminée',cancelled:'Annulée'};
function itemsHtml(json){let items=[];try{items=JSON.parse(json||'[]')}catch{}if(!Array.isArray(items)||!items.length)return '<p>'+esc(json)+'</p>';return '<ul class="lines">'+items.map(i=>{const o=i.options||{},bits=[o.spice?'Épices : '+o.spice:'',...(o.removals||[]),o.note?'« '+o.note+' »':''].filter(Boolean);return '<li><b>'+esc(i.quantity)+' × '+esc(i.name)+'</b>'+(bits.length?'<small>'+esc(bits.join(' · '))+'</small>':'')+'</li>'}).join('')+'</ul>'}
function renderStore(st){const open=st.open;$('#store').innerHTML='<div><span class="dot'+(open?'':' off')+'"></span><b>'+(open?'Commandes en ligne ouvertes':(st.paused?'Commandes en pause':'Fermé selon les horaires'))+'</b><br><span class="muted">Aujourd’hui : '+esc(st.today_label)+(st.paused?'':' · prochaine ouverture : '+esc(st.next_open_label||'—'))+'</span></div><button class="'+(st.paused?'alt':'warn')+'" data-pause="'+(st.paused?'0':'1')+'">'+(st.paused?'Reprendre les commandes':'Mettre en pause')+'</button>'}
let seen=0;function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.35)}catch{}}
async function load(){const [o,r,st]=await Promise.all([api('orders'),api('reservations'),api('store')]);renderStore(st);const maxId=Math.max(0,...o.orders.map(x=>x.id));if(seen&&maxId>seen){beep();document.title='🔔 Nouvelle commande · Espace équipe'}seen=Math.max(seen,maxId);$('#orders').innerHTML=o.orders.length?o.orders.map(x=>'<article class="card"><div class="row"><b>Commande #'+x.id+' · '+esc(x.customer_name)+'</b><span class="pill">'+esc(FR[x.status]||x.status)+'</span></div><p>'+esc(x.customer_phone)+' · '+money(x.total_cents)+(x.eta_minutes?' · promis en '+x.eta_minutes+'–'+(x.eta_minutes+10)+' min':'')+'</p><p><b>'+((x.fulfillment==='delivery')?'Livraison':'Ramassage')+'</b>'+(x.fulfillment==='delivery'?' · '+esc(x.delivery_address||'Adresse manquante'):'')+'</p>'+itemsHtml(x.items_json)+(x.notes?'<p><b>Instructions :</b> '+esc(x.notes)+'</p>':'')+'<div class="row">'+['confirmed','preparing','ready','completed'].map(s=>'<button data-order="'+x.id+'" data-status="'+s+'">'+({confirmed:'Confirmer',preparing:'En préparation',ready:'Prête',completed:'Terminée'}[s])+'</button>').join('')+'</div></article>').join(''):'<p class="panel">Aucune commande active.</p>';$('#reservations').innerHTML=r.reservations.length?r.reservations.map(x=>'<article class="card"><b>'+esc(x.customer_name)+'</b> · '+x.party_size+' personne(s)<p>'+esc(x.reservation_at)+' · '+esc(x.customer_phone)+'</p><p>'+esc(x.notes)+'</p><span class="pill">'+esc(x.status)+'</span></article>').join(''):'<p class="panel">Aucune réservation active.</p>'}
async function start(){try{const s=await api('session');if(s.role!=='employee')throw Error('Ce compte n’est pas un compte employé.');$('#login').hidden=true;$('#app').hidden=false;await load()}catch{}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const s=await api('login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(s.role!=='employee')throw Error('Compte employé requis.');await start()}catch(x){$('#error').textContent=x.message}};
$('#refresh').onclick=()=>load().catch(e=>alert(e.message));$('#logout').onclick=async()=>{await api('logout',{method:'POST'});location.reload()};
document.addEventListener('click',async e=>{const pz=e.target.closest('[data-pause]');if(pz){try{await api('store',{method:'POST',body:JSON.stringify({paused:pz.dataset.pause==='1'})});await load()}catch(x){alert(x.message)}return}const b=e.target.closest('[data-order]');if(!b)return;try{await api('orders/'+b.dataset.order,{method:'PATCH',body:JSON.stringify({status:b.dataset.status})});await load()}catch(x){alert(x.message)}});
setInterval(()=>{if(!$('#app').hidden)load().catch(()=>{})},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)document.title='Espace équipe | Sparta Chicken'});
start();
</script></body></html>
