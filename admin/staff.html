<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Comptes équipe | Sparta Chicken</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4e8c9;color:#2b211b;font:15px system-ui}header{background:#271e1e;color:#fff4df;padding:22px max(16px,calc((100vw - 900px)/2));border-bottom:4px solid #d9a441}main{max-width:900px;margin:25px auto;padding:0 16px}.card{background:#fff8e9;border:1px solid #ddc58e;border-radius:14px;padding:18px;margin:14px 0}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{display:grid;gap:6px;font-size:13px}input,select{padding:11px;border:1px solid #d9c18a;border-radius:8px;background:white}button{padding:11px 14px;border:0;border-radius:8px;background:#dba536;font-weight:800;cursor:pointer}button.off{background:#681b2b;color:white}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#766b5e;font-size:12px}.err{color:#a72b25}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:11px;border-bottom:1px solid #eadbb9;font-size:13px}
</style><body><header><h1>Gestion des comptes équipe</h1><p>Administration propriétaire · By Sparta Chicken</p></header><main><section id="login" class="card"><h2>Connexion propriétaire</h2><form id="loginForm"><label>Nom d’utilisateur<input name="username" required></label><label>Mot de passe<input name="password" type="password" required></label><button>Connexion</button></form><p id="error" class="err"></p></section><section id="app" hidden><div class="card"><h2>Créer un compte</h2><form id="create"><label>Nom d’utilisateur<input name="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_.-]+" required></label><label>Mot de passe temporaire<input name="password" type="password" minlength="8" required></label><label>Type de compte<select name="role"><option value="employee">Employé restaurant</option><option value="driver">Livreur</option></select></label><button>Créer le compte</button></form><p class="muted">Transmets le mot de passe temporaire directement à la personne concernée.</p><p id="result"></p></div><div class="card"><h2>Comptes existants</h2><div id="accounts"></div></div></section></main><script>
const $=s=>document.querySelector(s);async function api(p,o={}){const r=await fetch('/api/admin/'+p,{credentials:'same-origin',headers:{'content-type':'application/json'},...o}),d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');return d}
async function load(){const d=await api('staff');$('#accounts').innerHTML='<table><thead><tr><th>Compte</th><th>Rôle</th><th>État</th><th>Dernière connexion</th><th>Action</th></tr></thead><tbody>'+d.accounts.map(x=>'<tr><td>'+x.username+'</td><td>'+(x.role==='driver'?'Livreur':'Employé')+'</td><td>'+(x.active?'Actif':'Désactivé')+'</td><td>'+(x.last_login_at||'Jamais')+'</td><td><button class="'+(x.active?'off':'')+'" data-id="'+x.id+'" data-active="'+(!x.active)+'">'+(x.active?'Désactiver':'Réactiver')+'</button></td></tr>').join('')+'</tbody></table>'}
async function start(){try{await api('session');$('#login').hidden=true;$('#app').hidden=false;await load()}catch{}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await start()}catch(x){$('#error').textContent=x.message}};
$('#create').onsubmit=async e=>{e.preventDefault();try{await api('staff',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});$('#result').textContent='Compte créé.';e.target.reset();await load()}catch(x){$('#result').textContent=x.message}};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-id]');if(!b)return;try{await api('staff/'+b.dataset.id,{method:'PATCH',body:JSON.stringify({active:b.dataset.active==='true'})});await load()}catch(x){alert(x.message)}});
start();
</script></body></html>
