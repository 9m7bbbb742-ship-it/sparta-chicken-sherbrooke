<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Espace équipe | Sparta Chicken</title><style>
:root{color-scheme:light;--wine:#681b2b;--gold:#e0ad36;--cream:#fff8e9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8f0df,#ead5a7);color:#2b211b;font:15px system-ui}header{background:linear-gradient(110deg,#271e1e,#681b2b);color:#fff4df;padding:22px max(18px,calc((100vw - 950px)/2));border-bottom:4px solid var(--gold)}header h1{margin:3px 0;font-size:25px}header small{letter-spacing:.14em;color:#f0c765}main{max-width:950px;margin:25px auto;padding:0 16px}.panel,.card{background:var(--cream);border:1px solid #ddc58e;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #51320d0b}.login{max-width:420px;margin:9vh auto}.login h2{margin-top:0}label{display:grid;gap:6px;margin:12px 0;color:#5d4b3a;font-size:13px}input{padding:12px;border:1px solid #d9c18a;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:11px 15px;background:linear-gradient(110deg,#f0ce73,#dba536);font-weight:800;color:#291d12;cursor:pointer;margin:4px}button.alt{background:#681b2b;color:#fff4df}.muted{color:#766b5e;font-size:13px}.error{color:#a72b25}.item{border-top:1px solid #eadbb9;padding:14px 0}.item:first-child{border:0}.pill{display:inline-block;background:#f2e3bd;border-radius:30px;padding:4px 9px;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
</style><body><header><small>BY SPARTA CHICKEN · SHERBROOKE</small><h1>Espace équipe restaurant</h1></header><main><section id="login" class="panel login"><h2>Connexion employé</h2><form id="loginForm"><label>Nom d’utilisateur<input name="username" autocomplete="username" required></label><label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label><button>Se connecter</button><p id="error" class="error"></p></form></section><section id="app" hidden><div class="row"><h2>Commandes à traiter</h2><button class="alt" id="refresh">Actualiser</button><button id="logout">Déconnexion</button></div><p class="muted">Mise à jour des statuts de préparation.</p><div id="orders"></div><h2>Réservations</h2><div id="reservations"></div></section></main><script>
const $=s=>document.querySelector(s),money=n=>(Number(n||0)/100).toLocaleString('fr-CA',{style:'currency',currency:'CAD'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o={}){const r=await fetch('/api/staff/'+p,{credentials:'same-origin',headers:{'content-type':'application/json'},...o}),d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');return d}
async function load(){const [o,r]=await Promise.all([api('orders'),api('reservations')]);$('#orders').innerHTML=o.orders.length?o.orders.map(x=>'<article class="card"><div class="row"><b>Commande #'+x.id+' · '+esc(x.customer_name)+'</b><span class="pill">'+esc(x.status)+'</span></div><p>'+esc(x.customer_phone)+' · '+money(x.total_cents)+'</p><p>'+esc(x.items_json)+'</p><div class="row">'+['confirmed','preparing','ready','completed'].map(s=>'<button data-order="'+x.id+'" data-status="'+s+'">'+({confirmed:'Confirmer',preparing:'En préparation',ready:'Prête',completed:'Terminée'}[s])+'</button>').join('')+'</div></article>').join(''):'<p class="panel">Aucune commande active.</p>';$('#reservations').innerHTML=r.reservations.length?r.reservations.map(x=>'<article class="card"><b>'+esc(x.customer_name)+'</b> · '+x.party_size+' personne(s)<p>'+esc(x.reservation_at)+' · '+esc(x.customer_phone)+'</p><p>'+esc(x.notes)+'</p><span class="pill">'+esc(x.status)+'</span></article>').join(''):'<p class="panel">Aucune réservation active.</p>'}
async function start(){try{await api('session');$('#login').hidden=true;$('#app').hidden=false;await load()}catch{}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await start()}catch(x){$('#error').textContent=x.message}};
$('#refresh').onclick=()=>load().catch(e=>alert(e.message));$('#logout').onclick=async()=>{await api('logout',{method:'POST'});location.reload()};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-order]');if(!b)return;try{await api('orders/'+b.dataset.order,{method:'PATCH',body:JSON.stringify({status:b.dataset.status})});await load()}catch(x){alert(x.message)}});
start();
</script></body></html>
